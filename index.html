<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f9ff" />
  <title>Sip — Daily Water Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="tracker-card" aria-labelledby="app-title">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">💧</span>
          <span id="app-title">Sip</span>
        </div>
        <button class="icon-button" id="goalButton" type="button" aria-label="Change daily water goal" title="Change daily goal">⚙</button>
      </header>

      <div class="intro">
        <p class="eyebrow" id="greeting">Hello</p>
        <h1>Stay hydrated today.</h1>
        <p>Small sips add up. Keep going.</p>
      </div>

      <section class="progress-section" aria-label="Today's water progress">
        <div class="progress-ring" id="progressRing" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-ring-inner">
            <strong id="percentage">0%</strong>
            <span>today</span>
          </div>
        </div>
        <div class="amount-copy">
          <strong><span id="currentAmount">0</span> / <span id="goalAmount">2,000</span> ml</strong>
          <span>Daily water goal</span>
        </div>
      </section>

      <section class="glasses-section">
        <div class="section-heading">
          <h2>Today's glasses</h2>
          <span id="glassCount">0 of 8</span>
        </div>
        <div class="glasses" id="glasses" aria-label="Water glasses progress"></div>
      </section>

      <section class="quick-add-section">
        <h2>Quick add</h2>
        <div class="quick-actions">
          <button class="add-button" type="button" data-amount="250">+250 ml</button>
          <button class="add-button" type="button" data-amount="500">+500 ml</button>
          <button class="secondary-button" id="customButton" type="button">Custom</button>
        </div>
      </section>

      <div class="status-card" id="statusCard" aria-live="polite">
        <span aria-hidden="true">💧</span>
        <p id="statusText">2,000 ml left to reach your goal</p>
      </div>

      <button class="undo-button" id="undoButton" type="button" disabled>↶ Undo last entry</button>
    </section>
  </main>

  <dialog id="customDialog">
    <form method="dialog" id="customForm" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <p class="eyebrow">Custom amount</p>
      <h2>How much did you drink?</h2>
      <label for="customAmount">Amount in ml</label>
      <input id="customAmount" type="number" inputmode="numeric" min="1" max="5000" step="1" placeholder="e.g. 350" required />
      <p class="form-error" id="customError" aria-live="polite"></p>
      <button class="primary-button" id="saveCustom" value="default">Add water</button>
    </form>
  </dialog>

  <dialog id="goalDialog">
    <form method="dialog" id="goalForm" class="dialog-card">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <p class="eyebrow">Daily goal</p>
      <h2>Set your water goal</h2>
      <label for="newGoal">Goal in ml</label>
      <input id="newGoal" type="number" inputmode="numeric" min="250" max="10000" step="50" required />
      <p class="form-error" id="goalError" aria-live="polite"></p>
      <button class="primary-button" id="saveGoal" value="default">Save goal</button>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
